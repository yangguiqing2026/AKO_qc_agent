agent_id: AKO_qc_agent
name: AKO QC Agent（质检员）
name_zh: 阿格质检Agent
version: 1.0.0
author: AKO_studio
category: ['quality']
interface_type: cli
status: production
description: AKO_Hub 出厂质量门（Quality Gate）。按 law_v1.0 标准对所有生产型 Agent 输出执行五层检测（L1契约→L2知识库→L3品牌→L4业务逻辑→L5安全），输出结构化 qc_report.json。支持审计模式与拦截模式双态运行。
capabilities:
- id: cap_l1_contract
  name: L1 契约合规检测
  description: JSON Schema 验证、字段必填、类型正确、工程编号格式、材料标号白名单校验
  input:
  - name: upstream_output
    type: json
    required: true
    description: 上游 Agent 完整输出
  - name: expected_schema
    type: json
    required: true
    description: 预期 JSON Schema
  output:
  - name: l1_report
    type: json
    description: 契约合规报告
  priority: P0
- id: cap_l2_kb_consistency
  name: L2 知识库一致性
  description: 关键事实可溯源、禁止通用填补、来源标注、版本时效、引用完整性校验（LLM语义比对+向量检索）
  input:
  - name: upstream_output
    type: json
    required: true
  - name: kb_context
    type: list
    required: true
    description: 知识库检索上下文
  output:
  - name: l2_report
    type: json
    description: 知识库一致性报告
  priority: P0
- id: cap_l3_brand
  name: L3 品牌与格式规范
  description: AKO色系合规（#EBDAB9/#231E1C等）、AI痕迹检测、编号体系统一
  input:
  - name: upstream_output
    type: json_or_text
    required: true
  output:
  - name: l3_report
    type: json
    description: 品牌格式报告（WARN级不拦截）
  priority: P1
- id: cap_l4_logic
  name: L4 业务逻辑校验
  description: 数值区间校验、参数自洽、逻辑一致性、精度单位检查（调用 ako_qc_rules_engine 确定性规则引擎）
  input:
  - name: upstream_output
    type: json
    required: true
  output:
  - name: l4_report
    type: json
    description: 业务逻辑校验报告
  priority: P0
- id: cap_l5_security
  name: L5 安全与敏感信息
  description: 本地路径泄露、凭证Token泄露、内网域名暴露检测
  input:
  - name: upstream_output
    type: json_or_text
    required: true
  output:
  - name: l5_report
    type: json
    description: 安全检测报告
  priority: P0
- id: cap_rules_engine
  name: 规则引擎
  description: 加载 ako_qc_rules collection 中的结构化规则（YAML/JSON），执行 L4 数值判定，与 LLM 推理完全解耦
  input:
  - name: ruleset_name
    type: string
    required: true
  - name: version
    type: string
    required: true
  output:
  - name: rule_report
    type: json
    description: 规则引擎专项报告
  priority: P0
architecture:
  language: Python
  framework: LangGraph
  entry_point: src/core/main.py
  config_files:
  - config/default.yaml
  - secrets.env
  dependencies:
  - requirements.txt
  - AKO_agent_sdk_v2.py
  - ako_qc_rules_engine.py
runtime:
  endpoint: http://localhost:5001
  heartbeat_interval: 60
  last_heartbeat: ''
  status: ''
  pid: 0
  start_time: ''
org:
  department: 技术中心
  product_line: AKO_qc_system
  reports_to: AKO_hub
  team: 质量合规组
dependencies:
- agent_id: AKO_hub
  type: reports_to
  required: true
  description: 任务分发上级
- agent_id: AKO_law_agent
  type: notify
  required: true
  description: 严重违规触发 law_agent 审查
- agent_id: AKO_registry_agent
  type: read
  required: true
  description: 读取 Agent 注册信息
metadata:
  created: '2026-07-29'
  updated: '2026-07-31'
  tags:
  - 技术/AI-Agent
  - 工作/质控
  - 资料/规范
  documents:
    whitepaper:
      filename: AKO_qc_agent_whitepaper_v1.0.md
      path: ./AKO_qc_agent_whitepaper_v1.0.md
      version: 1.0.0
      status: production
      last_verified: ''
health:
  enabled: true
  probe_interval: 60
  business_probes:
  - name: 核心功能自检
    enabled: true
    timeout: 30
  - name: 规则引擎加载
    enabled: true
    timeout: 10
  - name: 依赖服务可用
    enabled: true
    timeout: 5
  system_probes:
  - name: CPU使用率
    enabled: true
    threshold: 80
  - name: 内存使用率
    enabled: true
    threshold: 80
  - name: 磁盘空间
    enabled: true
    threshold: 80
  - name: 网络连通
    enabled: true
    timeout: 5
tags:
- qc
- quality
- compliance
- audit
- batch_ready
interfaces:
  input: JSON / CLI parameters
  output: qc_report.json / logs
health_probe:
  endpoint: /health
  expected_response: ok
registry:
  registry_agent: AKO_registry_agent
  registered: false
compliance:
  law_version: law_v1.0
  self_assessment:
    P1_metadata: 22
    P2_core_function: 28
    P3_interface: 24
    P4_robustness: 14
  veto_check:
    V1_no_hardcoded_secrets: true
    V2_no_gui_residuals: true
    V3_card_not_placeholder: true
    V4_no_circular_deps: true
    V5_arch_compliance: true
